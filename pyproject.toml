[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "djangocms-cookiesregtech"
version = "1.0.0"
description = "CookiesRegTech cookie consent for Django CMS and any Django site: guided connect, automatic banner injection, cookie scanner, and consent log."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SKYNET TECHNOLOGIES USA LLC" }]
requires-python = ">=3.9"
dependencies = ["Django>=4.2"]

[project.urls]
Homepage = "https://www.cookiesregtech.com"

[tool.setuptools.packages.find]
include = ["cookiesregtech*"]

[tool.setuptools.package-data]
cookiesregtech = ["templates/**/*", "static/**/*"]
